plugins { id 'com.android.application' }
android {
    namespace 'com.chivoman.juegovoxel'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'com.chivoman.juegovoxel'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '21'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
